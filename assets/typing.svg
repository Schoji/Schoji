<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 640 30'
    style='background-color: #00000000;'
    width='640px' height='30px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='6800ms' fill='remove'
                    values='m0,15 h0 ; m0,15 h640 ; m0,15 h640 ; m0,15 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#9DA7B3' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            I build mobile apps, web platforms and embedded things.
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6800ms' fill='remove'
                    values='m0,15 h0 ; m0,15 h640 ; m0,15 h640 ; m0,15 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#9DA7B3' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Mostly Flutter, Next.js and Python.
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='6800ms' fill='remove'
                    values='m0,15 h0 ; m0,15 h640 ; m0,15 h640 ; m0,15 h0' keyTimes='0;0.58823529411765;0.85294117647059;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#9DA7B3' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Writing code. Occasionally even on purpose.
        </textPath>
    </text>
</svg>
